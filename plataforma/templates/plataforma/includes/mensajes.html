{# Avisos de confirmación o error que aparecen arriba de la página. #}
{% if messages %}
<div class="avisos-flotantes" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="aviso-flotante tipo-{{ message.tags|default:'info' }}">
        {% if message.tags == 'success' %}<i class="fa-solid fa-circle-check" aria-hidden="true"></i>{% elif message.tags == 'danger' %}<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>{% elif message.tags == 'warning' %}<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>{% else %}<i class="fa-solid fa-circle-info" aria-hidden="true"></i>{% endif %}
        <span>{{ message }}</span>
        <button type="button" class="cerrar" aria-label="Cerrar aviso">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
