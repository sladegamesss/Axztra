{% extends 'plataforma/base.html' %}
{# Página de error propia (403, 404 y 500). #}
{% block title %}{{ titulo }} - AXZTRA{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="contenedor pagina-error">
    <div class="codigo" aria-hidden="true">{{ codigo }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <div class="fila fila-centrada">
        <a class="boton boton-primario" href="{% url 'inicio' %}">Ir al inicio</a>
        <a class="boton boton-secundario" href="{% url 'catalogo' %}">Ver servicios</a>
    </div>
</div>
{% endblock %}
